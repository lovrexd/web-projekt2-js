<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelovnik | Beefsteak Zadar</title>
    <link rel="stylesheet" href="../styles/tokens.css">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
</head>
<body>

<header>
    <div class="logo no-select">BEEFSTEAK <span>ZADAR</span></div>
    
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label" aria-label="Otvori izbornik">
        <span></span>
    </label>

    <nav aria-label="Glavna navigacija">
        <ul>
            <li><a href="../index.html" class="no-select">Početna</a></li>
            <li><a href="jelovnik.html" class="active no-select">Jelovnik</a></li>
            <li><a href="o-nama.html" class="no-select">O nama</a></li>
            <li><a href="kontakt.html" class="no-select">Kontakt</a></li>
        </ul>
    </nav>
</header>

<main class="container">
    <div id="view-list">
        <h1 class="page-title" style="display: flex; align-items: center; justify-content: center;">
            <img src="../assets/img/menu.png" width="69" style="margin-right: 15px;" alt="Menu">
            Naš Menu & Cjenik
        </h1>

        <div class="filter-container">
            <div style="margin-bottom: 20px;">
                <input type="text" id="search-input" placeholder="Pretraži jela po imenu..." style="max-width: 400px; padding: 10px; border-radius: 20px; text-align: center;">
            </div>
            <div class="filter-bar">
                <button class="active" data-filter="all">Sve</button>
                <button data-filter="favorites" style="border-color: #d32f2f; color: #d32f2f;">★ Moji Favoriti</button>
                <button data-filter="predjela">Predjela & Juhe</button>
                <button data-filter="odresci">Vrhunski Odresci</button>
                <button data-filter="glavna">Glavna Jela</button>
                <button data-filter="salate">Salate</button>
                <button data-filter="prilozi">Prilozi</button>
                <button data-filter="pica">Pića</button>
            </div>
        </div>

        <div id="status-loading" hidden style="text-align:center; padding: 40px;">Učitavanje jelovnika...</div>
        <div id="status-error" hidden style="text-align:center; padding: 40px; color: red;"><p></p></div>

        <div id="jelovnik-container" class="jelovnik-grid-layout"></div>
    </div>

    <div id="view-detail" hidden>
        <button id="btn-back" class="btn-back">← Natrag na jelovnik</button>
        <div class="detail-card">
            <img id="detail-img" src="" alt="">
            <h2 id="detail-title"></h2>
            <p id="detail-desc"></p>
            <div class="detail-price" id="detail-price"></div>
        </div>
    </div>
</main>

<footer style="text-align: center; padding: 20px; margin-top: 40px;">
    <p>© 2026 Beefsteak Zadar. Studij IT, UNIZD.</p>
    <div class="social-icons" style="margin-top: 10px;">
        <a href="https://www.facebook.com" target="_blank" style="margin: 0 10px;"><img src="../assets/img/facebook.svg" alt="Facebook" width="24" height="24"></a>
        <a href="https://www.instagram.com" target="_blank" style="margin: 0 10px;"><img src="../assets/img/instagram.svg" alt="Instagram" width="24" height="24"></a>
    </div>
</footer>

<script type="module" src="../js/main.js"></script>

</body>
</html>
